name: Release TV

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.tv'

run-name: Release TV ${{ github.ref_name }}

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.body }}
      version: ${{ steps.version.outputs.name }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read tag annotation as release notes
        id: notes
        run: |
          BODY=$(git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME")
          if [ -z "$BODY" ]; then
            echo "::error::Tag $GITHUB_REF_NAME has no annotation message, so it can't provide release notes. Push an annotated tag instead: git tag -a $GITHUB_REF_NAME -m \"release notes\" && git push origin $GITHUB_REF_NAME"
            exit 1
          fi
          {
            echo "body<<NOTES_EOF"
            echo "$BODY"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Strip the TV suffix from the tag
        id: version
        run: echo "name=${GITHUB_REF_NAME%.tv}" >> "$GITHUB_OUTPUT"

  verify:
    needs: [ check-tag ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Fetch Firebase google-services.json
        uses: ./.github/actions/fetch-google-services
        with:
          firebase-token: ${{ secrets.FIREBASE_TOKEN }}
          firebase-app-id: ${{ secrets.FIREBASE_APP_ID }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Verify release
        run: |
          ./gradlew spotlessCheck detektDebug :build-logic:convention:detektMain lintRelease --continue

  build-release:
    needs: [ check-tag ]
    runs-on: ubuntu-latest
    outputs:
      apk_name: apk-analyzer-tv-${{ needs.check-tag.outputs.version }}.apk
      aab_name: apk-analyzer-tv-${{ needs.check-tag.outputs.version }}.aab

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Fetch Firebase google-services.json
        uses: ./.github/actions/fetch-google-services
        with:
          firebase-token: ${{ secrets.FIREBASE_TOKEN }}
          firebase-app-id: ${{ secrets.FIREBASE_APP_ID }}
          firebase-project-id: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Compute versionCode from tag
        id: version
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          CODE=$(bash .github/scripts/version-code.sh "$VERSION" tv)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        uses: ./.github/actions/setup-release-signing
        with:
          sign-key: ${{ secrets.SIGN_KEY }}
          sign-key-alias: ${{ secrets.SIGN_KEY_ALIAS }}
          sign-key-store-password: ${{ secrets.SIGN_KEY_STORE_PASSWORD }}
          sign-key-password: ${{ secrets.SIGN_KEY_PASSWORD }}

      - name: Build and sign release AAB and APK
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          ./gradlew :tv:bundleRelease :tv:assembleRelease \
            -Pversion.code=${{ steps.version.outputs.code }} \
            -Pversion.name="$VERSION"

      - name: Rename release artifacts
        env:
          VERSION: ${{ needs.check-tag.outputs.version }}
        run: |
          mv tv/build/outputs/bundle/release/*.aab "tv/build/outputs/bundle/release/apk-analyzer-tv-$VERSION.aab"
          mv tv/build/outputs/apk/release/*.apk "tv/build/outputs/apk/release/apk-analyzer-tv-$VERSION.apk"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-analyzer-tv-aab
          path: tv/build/outputs/bundle/release/apk-analyzer-tv-${{ needs.check-tag.outputs.version }}.aab
          compression-level: 0
          if-no-files-found: error

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-analyzer-tv-apk
          path: tv/build/outputs/apk/release/apk-analyzer-tv-${{ needs.check-tag.outputs.version }}.apk
          compression-level: 0
          if-no-files-found: error

      - name: Upload mapping file artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-analyzer-tv-mapping
          path: tv/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

  publish-github-release:
    needs: [ check-tag, verify, build-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-analyzer-tv-apk
          path: artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: TV ${{ needs.check-tag.outputs.version }}
          tag_name: ${{ github.ref_name }}
          body: ${{ needs.check-tag.outputs.notes }}
          files: artifacts/${{ needs['build-release'].outputs.apk_name }}
          make_latest: false

  publish-play-store:
    needs: [ verify, build-release ]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Gradle build environment
        uses: ./.github/actions/setup-gradle-build

      - name: Download AAB artifact
        uses: actions/download-artifact@v8
        with:
          name: apk-analyzer-tv-aab
          path: artifacts

      - name: Publish to Play Store Beta TV track
        env:
          ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
        run: ./gradlew :tv:publishBundle --artifact-dir artifacts --track "tv:Beta TV"
