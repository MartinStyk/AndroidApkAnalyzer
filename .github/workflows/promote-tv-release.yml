name: Promote TV release to production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'TV version being promoted (e.g. 3.5.0 or 3.5.0.tv)'
        required: true
      rollout-percentage:
        description: 'Percentage of TV production users to receive the update (1-100)'
        required: false
        default: '100'

run-name: Promote TV ${{ inputs.version }} to production (${{ inputs.rollout-percentage }}%)

permissions:
  contents: read

jobs:
  promote:
    uses: ./.github/workflows/promote-release.yml
    with:
      version: ${{ inputs.version }}
      rollout-percentage: ${{ inputs.rollout-percentage }}
      form-factor: tv
    secrets: inherit
